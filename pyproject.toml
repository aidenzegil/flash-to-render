[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-to-render"
version = "0.1.0"
description = "Turn tattoo flash sheets into per-design 3D renders (extruded glTF meshes) and clean ink cutouts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Aiden Zegil" }]
keywords = ["tattoo", "flash", "potrace", "gltf", "extrude", "3d", "opencv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pillow>=10",
    "potracer>=0.0.4",
    "mapbox_earcut>=1.0",
    "shapely>=2.0",
    "trimesh>=4.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
label = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "flash-to-render[server]"]

[project.scripts]
flash-to-render = "flash_to_render.cli:main"

[project.urls]
Homepage = "https://github.com/aidenzegil/flash-to-render"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flash_to_render = ["preview.html", "app.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
